<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./links/assets/avatar.png" type="image/png" />
    <title>NoxTheSnake</title>
    <meta name="description" content="I'm a snake into programming, making YouTube videos, and playing Minecraft & VRChat." />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Подключаем оба CSS, чтобы наследовать базовые стили -->
    <link rel="stylesheet" href="./links/css/style.css" />
    <link rel="stylesheet" href="./home/home.css" />
</head>
<body class="dark-theme">
<div id="page-wrap" class="w-full max-w-2xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- Био -->
    <section class="card text-center p-6 m3-shadow-md">
        <img class="w-28 h-28 rounded-full mx-auto mb-4 border-4 object-cover" id="avatar" src="./links/assets/avatar.png" alt="Avatar" />
        <h1 class="text-4xl font-bold mb-2">NoxTheSnake</h1>
        <p class="text-lg text-gray-400 mb-4">
            I'm a snake into programming, making YouTube videos, and playing Minecraft & VRChat. Fun, curious, and a bit horny ^^
        </p>
        <a href="./links/" class="primary-button inline-flex items-center gap-2 px-6 py-3 rounded-full font-medium m3-shadow-md">
            <span class="material-symbols-outlined">link</span>
            <span>All My Links</span>
        </a>
    </section>

    <!-- Арт -->
    <section class="card p-6 mt-6 m3-shadow-md">
        <img class="w-full rounded-lg" src="./links/assets/art.png" alt="Artwork by NoxTheSnake" />
    </section>

    <!-- Переключатель темы -->
    <div class="flex justify-center items-center mt-8 mb-8">
        <button id="theme-toggle-bottom" class="control-button p-3 rounded-full m3-shadow-md">
            <span class="material-symbols-outlined" id="theme-icon-bottom">light_mode</span>
        </button>
    </div>

</div>
<!-- Убедитесь, что путь к скрипту правильный -->
<script type="module" src="./home/home.js"></script>
</body>
</html>
