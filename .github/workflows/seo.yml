name: seo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build robots/sitemap + submit IndexNow
        run: node scripts/seo.mjs

      - name: Commit regenerated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add robots.txt sitemap.xml
          git diff --cached --quiet || git commit -m "chore(seo): regenerate sitemap/robots + IndexNow submit"
          git push
